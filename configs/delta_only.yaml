# Control for "erasure without protection" (Deep-Delta-style). Isolates the value of PROTECTION.
batch_size: 64
max_steps: 3000
lr: 3.0e-4
device: auto
log_every: 100
out_dir: outputs/toy/delta_only
model:
  n_layer: 4
  n_head: 4
  dim: 128
  block_size: 128
  mlp_mult: 4
  residual: delta_only
  tie_delta_gates: true
