# Local CPU smoke for the LM path (pseudo-text, byte-level). Verifies tokenize -> train ->
# val -> massive-activation measurement end-to-end in ~1 min.
#   python -m ledger.train_lm --config configs/lm_smoke.yaml
data: pseudo
tokenizer: bytes
max_tokens: 200000
val_tokens: 20000
batch_size: 16
max_steps: 100
warmup_steps: 10
log_every: 25
eval_every: 50
commit_sparsity: 0.02
device: cpu
out_dir: outputs/lm_smoke
model:
  n_layer: 4
  n_head: 4
  dim: 128
  block_size: 128
  mlp_mult: 4
  residual: ledger
  gamma: 0.0
